<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goku Live Depth Wallpaper</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

.wallpaper {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #000;
}

.goku {
  position: absolute;
  width: 120%;
  height: 120%;
  left: -10%;
  top: -10%;
  object-fit: cover;
  transition: transform 0.15s ease-out;
}

.overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.35),
    transparent 35%,
    rgba(0,0,0,0.55)
  );
}

.info {
  position: absolute;
  top: 35px;
  left: 0;
  width: 100%;
  text-align: center;
  color: white;
  text-shadow: 0 3px 12px black;
}

.time {
  font-size: 58px;
  font-weight: bold;
  letter-spacing: 2px;
}

.date {
  margin-top: 8px;
  font-size: 18px;
}

.title {
  position: absolute;
  bottom: 55px;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 5px;
  text-shadow: 0 3px 12px black;
}
</style>
</head>

<body>

<div class="wallpaper">

  <img class="goku" src="images (4).jpeg" alt="Goku">

  <div class="overlay"></div>

  <div class="info">
    <div class="time" id="time">00:00:00</div>
    <div class="date" id="date">Loading...</div>
  </div>

  <div class="title">
    GOKU • ULTRA INSTINCT
  </div>

</div>

<script>
function updateClock() {
  const now = new Date();

  document.getElementById("time").textContent =
    now.toLocaleTimeString("en-IN", {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    });

  document.getElementById("date").textContent =
    now.toLocaleDateString("en-IN", {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    });
}

updateClock();
setInterval(updateClock, 1000);

document.addEventListener("mousemove", function(e) {
  const x = (e.clientX / window.innerWidth - 0.5) * 12;
  const y = (e.clientY / window.innerHeight - 0.5) * 12;

  document.querySelector(".goku").style.transform =
    `translate(${x}px, ${y}px) scale(1.05)`;
});
</script>

</body>
</html>
