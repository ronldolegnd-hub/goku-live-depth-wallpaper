<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goku Depth Wallpaper</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

.wallpaper {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #000;
}

/* Goku image */
.goku {
  position: absolute;
  width: 125%;
  height: 125%;
  left: -12.5%;
  top: -10%;
  object-fit: cover;
  transition: transform 0.15s ease-out;
  will-change: transform;
}

/* Dark fade at the bottom */
.overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.05) 0%,
    rgba(0,0,0,0.05) 45%,
    rgba(0,0,0,0.45) 100%
  );
  pointer-events: none;
}

/* Time + date */
.info {
  position: absolute;
  top: 6%;
  left: 0;
  width: 100%;
  text-align: center;
  color: white;
  text-shadow: 0 3px 12px #000;
  z-index: 5;
}

.time {
  font-size: clamp(55px, 16vw, 105px);
  font-weight: 700;
  letter-spacing: 2px;
}

.date {
  margin-top: 8px;
  font-size: clamp(17px, 5vw, 28px);
  font-weight: 400;
}

/* Bottom GOKU text */
.title {
  position: absolute;
  bottom: 7%;
  width: 100%;
  text-align: center;
  color: white;
  font-size: clamp(28px, 9vw, 55px);
  font-weight: 900;
  letter-spacing: 7px;
  text-shadow:
    0 3px 10px #000,
    0 0 20px rgba(0,120,255,0.8);
  z-index: 5;
}

/* Small label */
.subtitle {
  margin-top: 5px;
  font-size: clamp(11px, 3vw, 17px);
  letter-spacing: 4px;
  font-weight: bold;
}

/* Make it look good on phones */
@media (max-width: 500px) {
  .goku {
    width: 135%;
    height: 135%;
    left: -17.5%;
    top: -12%;
  }

  .info {
    top: 7%;
  }

  .title {
    bottom: 5%;
  }
}
</style>
</head>

<body>

<div class="wallpaper">

  <img src="goku.jpg" class="goku" id="goku">

  <div class="overlay"></div>

  <div class="info">
    <div class="time" id="time">00:00</div>
    <div class="date" id="date">Loading...</div>
  </div>

  <div class="title">
    GOKU
    <div class="subtitle">ULTRA INSTINCT</div>
  </div>

</div>

<script>

const timeText = document.getElementById("time");
const dateText = document.getElementById("date");
const goku = document.getElementById("goku");

/* Live clock */
function updateClock() {

  const now = new Date();

  const hours = String(now.getHours()).padStart(2, "0");
  const minutes = String(now.getMinutes()).padStart(2, "0");

  timeText.textContent = hours + ":" + minutes;

  const options = {
    weekday: "long",
    day: "numeric",
    month: "long",
    year: "numeric"
  };

  dateText.textContent =
    now.toLocaleDateString("en-IN", options);
}

updateClock();
setInterval(updateClock, 1000);


/* Phone movement / depth effect */
function moveGoku(x, y) {

  const moveX = x * 18;
  const moveY = y * 18;

  goku.style.transform =
    "translate(" + moveX + "px, " +
    moveY + "px) scale(1.03)";
}


/* Gyroscope */
window.addEventListener("deviceorientation", function(event) {

  let x = (event.gamma || 0) / 45;
  let y = (event.beta || 0) / 45;

  x = Math.max(-1, Math.min(1, x));
  y = Math.max(-1, Math.min(1, y));

  moveGoku(x, y);

});


/* Touch movement */
window.addEventListener("touchmove", function(event) {

  const touch = event.touches[0];

  const x =
    (touch.clientX / window.innerWidth - 0.5) * 2;

  const y =
    (touch.clientY / window.innerHeight - 0.5) * 2;

  moveGoku(x, y);

});

</script>

</body>
</html>
