
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goku Depth Wallpaper</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

.wallpaper {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #000;
}

/* BIG CLOCK BEHIND GOKU */
.clock {
  position: absolute;
  top: 5%;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: clamp(95px, 28vw, 210px);
  font-weight: 900;
  line-height: 1;
  color: rgba(255,255,255,0.95);
  letter-spacing: -5px;
  z-index: 1;
  white-space: nowrap;
}

/* DATE */
.date {
  position: absolute;
  top: 27%;
  width: 100%;
  text-align: center;
  color: white;
  font-size: clamp(16px, 5vw, 30px);
  z-index: 3;
  text-shadow: 0 2px 8px #000;
}

/* GOKU */
.goku {
  position: absolute;
  width: 125%;
  height: 125%;
  left: -12.5%;
  top: -5%;
  object-fit: cover;
  object-position: center;
  z-index: 2;
  transition: transform 0.15s ease-out;
  will-change: transform;
}

/* BLUE GLOW */
.glow {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  background:
    linear-gradient(
      to bottom,
      rgba(0,100,255,0.10),
      transparent 45%,
      rgba(0,0,0,0.35)
    );
}

/* TITLE */
.title {
  position: absolute;
  bottom: 4%;
  width: 100%;
  text-align: center;
  z-index: 5;
  color: white;
  font-size: clamp(18px, 6vw, 36px);
  font-weight: bold;
  letter-spacing: 5px;
